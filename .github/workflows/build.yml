name: build-pcl

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取 PCL 源码（含子模块）
        shell: pwsh
        run: |
          git clone --recursive https://github.com/Meloong-Git/PCL.git pcl
          if (-not (Test-Path pcl\MeloongCore\Shared\MeloongCore.csproj)) {
            throw "子模块 MeloongCore 未拉取成功"
          }

      - name: 解除下载限制
        shell: pwsh
        run: |
          $f = "pcl\Plain Craft Launcher 2\Modules\ModSecret.vb"
          $t = [System.IO.File]::ReadAllText($f, [System.Text.Encoding]::UTF8)
          $old = 'Public Const RestrictMcDownload As Boolean = True'
          $new = 'Public Const RestrictMcDownload As Boolean = False'
          if (-not $t.Contains($old)) { throw "没找到目标常量，源码可能已变动" }
          $t = $t.Replace($old, $new)
          [System.IO.File]::WriteAllText($f, $t, (New-Object System.Text.UTF8Encoding($true)))
          Write-Host "已把 RestrictMcDownload 改为 False"
          Select-String -LiteralPath $f -Pattern 'RestrictMcDownload As Boolean' | ForEach-Object { $_.Line.Trim() }

      - name: 还原依赖
        shell: pwsh
        run: |
          $projects = @(
            "pcl\MeloongCore\Shared\MeloongCore.csproj",
            "pcl\MeloongCore\Wpf\MeloongCore.Wpf.csproj",
            "pcl\PCLCS\PCLCS.csproj"
          )
          foreach ($p in $projects) {
            Write-Host "==> restore $p"
            & dotnet restore $p
            if ($LASTEXITCODE -ne 0) { throw "restore 失败：$p" }
          }

      - name: 编译
        shell: pwsh
        run: |
          $msbuild = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          }
          if (-not $msbuild) {
            $cmd = Get-Command msbuild.exe -ErrorAction SilentlyContinue
            if ($cmd) { $msbuild = $cmd.Source }
          }
          if (-not $msbuild) { throw "找不到 MSBuild" }
          Write-Host "MSBuild: $msbuild"
          & $msbuild "pcl\Plain Craft Launcher 2.sln" /nologo /v:m /p:Configuration=Release "/p:Platform=Any CPU"
          if ($LASTEXITCODE -ne 0) { throw "编译失败，退出码 $LASTEXITCODE" }

      - name: 收集产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem "pcl\Plain Craft Launcher 2\bin" -Filter "*.exe" -Recurse |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "找不到编译产物" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName "artifact\$($exe.Name)"
          $hash = (Get-FileHash "artifact\$($exe.Name)" -Algorithm SHA256).Hash
          Write-Host "$($exe.Name)  $($exe.Length) 字节"
          Write-Host "SHA-256: $hash"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PCL-解除下载限制
          path: artifact/*
          if-no-files-found: error
